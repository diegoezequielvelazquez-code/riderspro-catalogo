<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RidersPro Catalogo</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#f5f5f5;
    }

    header{
      background:black;
      color:white;
      padding:20px;
      text-align:center;
      border-bottom:5px solid #00ff66;
    }

    h1{
      margin:0;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
      padding:20px;
    }

    .card{
      background:white;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 4px 15px rgba(0,0,0,0.1);
    }

    .card img{
      width:100%;
      height:250px;
      object-fit:cover;
    }

    .info{
      padding:15px;
    }

    .precio{
      color:#00aa44;
      font-size:28px;
      font-weight:bold;
    }

    .btn{
      display:block;
      background:black;
      color:white;
      text-decoration:none;
      text-align:center;
      padding:12px;
      border-radius:12px;
      margin-top:10px;
      font-weight:bold;
    }
  </style>
</head>
<body>

<header>
  <h1>RidersPro Catalogo</h1>
  <p>Productos sincronizados automaticamente</p>
</header>

<div class="grid">

  <div class="card">
    <img src="https://picsum.photos/400/400" alt="">
    <div class="info">
      <h2>Producto ejemplo</h2>
      <div class="precio">$180.000</div>

      <a class="btn"
      href="https://wa.me/5493492668236">
      Consultar
      </a>
    </div>
  </div>

</div>

</body>
</html>
